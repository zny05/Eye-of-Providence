services:
  openstock:
    build:
      context: .
      args:
        # Fixed into the app at build time; set it in .env, then rebuild
        NEXT_PUBLIC_OPENSTOCK_DATA_MODE: ${NEXT_PUBLIC_OPENSTOCK_DATA_MODE:-cached}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # 强制走 mihomo 代理
      - NODE_USE_ENV_PROXY=1
      - HTTP_PROXY=http://10.1.1.238:7890
      - HTTPS_PROXY=http://10.1.1.238:7890
      # 内网和本地服务不走代理（非常重要）
      - NO_PROXY=localhost,127.0.0.1,mongodb,10.1.1.0/24,10.1.1.238,finnhub.io,*.finnhub.io
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      # Set MONGO_ROOT_PASSWORD in .env and use the same password in MONGODB_URI. Only read on the first start.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-makemoneytorich}
    # No published port: only the app reaches MongoDB, over the Compose network. To use mongosh or Compass from
    # your machine, add  ports: ["127.0.0.1:27017:27017"]  (a bare "27017:27017" exposes it on every interface).
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'db.adminCommand({ ping: 1 })'"
        ]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongo-data:
